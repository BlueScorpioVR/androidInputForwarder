plugins { id 'com.android.application' version '8.9.1' }

android {
    namespace 'com.limelight'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'net.philippe.headsetinput'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { ndkBuild { arguments 'NDK_APPLICATION_MK=' + file('jni/Application.mk') } }
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs = [layout.buildDirectory.dir('reader-libs').get().asFile]
        }
    }
    externalNativeBuild { ndkBuild { path file('jni/Android.mk') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources {
            excludes += '/META-INF/*.md'
            excludes += '/META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint {
        // Analyze only sources included in this APK, not unused upstream Moonlight UI/input classes.
        checkOnly 'net.philippe.headsetinput', 'com.limelight.nvstream', 'com.limelight.LimeLog', 'com.limelight.binding.crypto'
    }
}

tasks.register('buildRootReader', Exec) {
    def out = layout.buildDirectory.file('reader-libs/arm64-v8a/libheadset-reader.so')
    inputs.file('jni/input_reader.c')
    outputs.file(out)
    doFirst {
        out.get().asFile.parentFile.mkdirs()
        def host = System.getProperty('os.name').toLowerCase().contains('windows') ? 'windows-x86_64' : 'linux-x86_64'
        def clang = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/${host}/bin/clang" + (host.startsWith('windows') ? '.exe' : ''))
        commandLine clang, '--target=aarch64-linux-android29', '-O2', '-Wall', '-Wextra', '-Werror',
                    '-fPIE', '-pie', '-Wl,-z,max-page-size=16384', file('jni/input_reader.c'), '-o', out.get().asFile
    }
}
tasks.named('preBuild').configure { dependsOn 'buildRootReader' }

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    implementation 'com.squareup.okhttp3:okhttp-jvm:5.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
